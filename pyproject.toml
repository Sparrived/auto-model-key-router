[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-model-key-router"
version = "1.0.0"
description = "A lightweight local OpenAI-compatible model API key router"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
release = [
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
amkr = "auto_model_key_router.main:main"
auto-model-key-router = "auto_model_key_router.main:main"

[tool.setuptools.packages.find]
include = ["auto_model_key_router*"]
