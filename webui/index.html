<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>AMKR</title>
    <script>
      // 首屏主题脚本：在 React 挂载前决定 data-theme，避免深浅色闪烁。
      // 与 src/lib/theme.ts 共用 amkr.theme / amkr.accent 两个存储键；旧值 custom 视为 light。
      (function () {
        try {
          var root = document.documentElement;
          var pref = localStorage.getItem("amkr.theme");
          if (pref === "custom") pref = "light";
          if (pref !== "light" && pref !== "dark") pref = "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.setAttribute("data-theme-preference", pref);

          var accent = localStorage.getItem("amkr.accent");
          if (accent === "cobalt" || accent === "pine") {
            root.setAttribute("data-accent", accent);
          } else if (/^#[0-9a-fA-F]{6}$/.test(accent || "")) {
            root.setAttribute("data-accent", "custom");
            root.style.setProperty("--accent", accent);
            // 只推导首帧的 on-accent（对比度更高的黑白），hover 由 theme.ts 挂载后补齐。
            var r = parseInt(accent.slice(1, 3), 16) / 255;
            var g = parseInt(accent.slice(3, 5), 16) / 255;
            var b = parseInt(accent.slice(5, 7), 16) / 255;
            var channel = function (value) {
              return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
            };
            var luminance =
              0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
            var contrastLight = 1.05 / (luminance + 0.05);
            var contrastDark = (luminance + 0.05) / 0.05;
            root.style.setProperty(
              "--on-accent",
              contrastLight >= contrastDark ? "#fcfcfb" : "#121518",
            );
          }
        } catch (error) {
          // 隐私模式下 localStorage 会抛异常：按默认主题继续，不阻塞首屏。
        }
      })();
    </script>
