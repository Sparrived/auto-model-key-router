<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f5f9" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- 嵌入方的面板不该被搜索引擎收录：地址里带着凭据的 fragment，收录后可能
         经由结果页外泄。noindex 只影响索引，不影响正常嵌入。 -->
    <meta name="robots" content="noindex, nofollow" />
    <title>AMKR 工作空间面板</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var theme = params.get("theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./panel-main.js"></script>
  </body>
</html>
