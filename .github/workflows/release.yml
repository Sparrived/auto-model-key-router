name: Release

on:
  push:
    branches: [master]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package version
        id: package
        run: |
          version=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Stop if release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.existing_release.outputs.exists == 'false'
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        if: steps.existing_release.outputs.exists == 'false'
        run: python -m build

      - name: Check distributions
        if: steps.existing_release.outputs.exists == 'false'
        run: python -m twine check dist/*

      - name: Smoke test wheel
        if: steps.existing_release.outputs.exists == 'false'
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --upgrade pip
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/auto-model-key-router --help
          .release-smoke/bin/amkr --help
          .release-smoke/bin/python -c "from auto_model_key_router.visitor import visitor_feature_available; assert not visitor_feature_available()"
          wheel=$(find dist -name '*.whl' -print -quit)
          .release-smoke/bin/python -m pip install "${wheel}[visitor]"
          .release-smoke/bin/python -c "from auto_model_key_router.visitor import visitor_feature_available; assert visitor_feature_available()"

      - name: Generate release notes
        if: steps.existing_release.outputs.exists == 'false'
        env:
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          notes_path = Path("release-notes.md")
          changelog_path = Path("CHANGELOG.md")
          body = ""

          if changelog_path.exists():
              changelog = changelog_path.read_text(encoding="utf-8")
              version_heading = re.compile(
                  rf"^##\s+\[?v?{re.escape(version)}\]?(?:\s+-\s+.*)?\s*$",
                  re.MULTILINE,
              )
              match = version_heading.search(changelog)
              if match:
                  next_heading = re.search(r"^##\s+", changelog[match.end():], re.MULTILINE)
                  end = match.end() + next_heading.start() if next_heading else len(changelog)
                  body = changelog[match.end():end].strip()

          if not body:
              tags = subprocess.run(
                  ["git", "tag", "--sort=-v:refname"],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.splitlines()
              previous_tag = next((current_tag for current_tag in tags if current_tag != tag), "")
              current_ref = tag if tag in tags else "HEAD"
              revision_range = f"{previous_tag}..{current_ref}" if previous_tag else current_ref
              commits = subprocess.run(
                  ["git", "log", "--pretty=format:- %s (%h)", revision_range],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.strip()
              if commits:
                  title = f"Commits since {previous_tag}" if previous_tag else "Commits"
                  body = f"## {title}\n\n{commits}"
              else:
                  body = f"Release {version}"

          notes_path.write_text(body + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
