name: Release

# 发布流水线：打一个 `v*` tag 就会走完「测试门禁 -> 交叉编译 -> 校验和 -> GitHub Release」。
#
# 为什么需要它：v5.0.0 是我手工 `go build` 六个平台再 `gh release create` 传上去的。手工步骤
# 既容易漏平台、也没有门禁前置——tag 打在一个测试不通过的提交上也没人拦。
#
# 与 Python 时代的区别：那时 release.yml 读 pyproject、`python -m build`、`twine check`、
# 冒烟 wheel，产物是 PyPI 包；现在是交叉编译的二进制 + GitHub Release。publish-pypi.yml 已删除。
on:
  push:
    tags: ["v*"]
  # 允许手动触发以便演练：workflow_dispatch 不建 Release，只跑构建与校验。
  workflow_dispatch:

permissions:
  contents: write
  # 镜像推到 GHCR 需要 packages: write。与 contents 分列，避免给整个工作流放权。
  packages: write

jobs:
  # ---- 门禁：tag 上的代码必须先是绿的 ----
  verify:
    name: 发布前门禁
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与 ci.yml 一致：以 go.mod 的 go 指令为单一来源（当前 1.24.2）。
          # 写死 "1.24" 会解析到 1.24.x 里较旧的补丁版，触发 GOTOOLCHAIN 二次下载。
          go-version-file: go.mod
          cache: true

      - name: gofmt 格式检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Go 测试（go test）
        # 行为用例：配置解析与校验、canonical 序列化、key 选择、代理改写、指标读写等，
        # 不做任何网络访问。
        run: go test ./...

      - name: WebUI 资产检查（node）
        # 前端资产经 //go:embed 编进二进制，源码正确性仍单独验一遍。
        # 与 ci.yml 同一套检查；探针清单必须与 webui/probes/ 保持一致，漏掉一个等于
        # 发布门禁比 CI 松——那种缺口只会在发布后才被发现。
        run: |
          node scripts/webui_module_check.mjs
          node webui/probes/webui_chart_probe.mjs
          node webui/probes/webui_tip_probe.mjs
          node webui/probes/webui_chart_sizing_probe.mjs
          node webui/probes/webui_auth_probe.mjs
          node webui/probes/webui_pricing_probe.mjs
          node webui/probes/webui_providers_probe.mjs
          node webui/probes/webui_routing_probe.mjs
          node webui/probes/webui_panel_probe.mjs
          node webui/probes/webui_layout_probe.mjs
          node webui/probes/webui_guest_probe.mjs
          node webui/probes/webui_accesskeys_probe.mjs
          node webui/probes/webui_accounts_probe.mjs

  # ---- 容器镜像 ----
  #
  # 与二进制发布**并行**（都只依赖上面那个 verify 作业），因为两者互不依赖：二进制给
  # 直接安装的用户，镜像给 compose / k8s 部署。分成独立作业还有个好处——镜像构建失败
  # 不会连坐已经能下载的二进制 Release。
  #
  # 为什么需要它：此前 release.yml 只出二进制，GHCR 上的
  # `ghcr.io/sparrived/auto-model-key-router` 是 Python 时代的遗留包（还是私有的），
  # 于是"用镜像部署"只能靠本机 docker build 再手工传上去，没人做就一直是旧版本。
  # 现在 tag 一打，镜像与二进制出自同一提交，`docker pull` 拿到的版本可追溯。
  image:
    name: 构建并推送容器镜像（GHCR）
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        # 与二进制作业同一套规则，但多一个 tag 输出：镜像 tag 不允许 `+`
        # （`0.0.0-dev+abc1234` 是非法 tag），所以手动触发时用固定的 `dev`。
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 GHCR
        if: steps.version.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # 用仓库自带的 GITHUB_TOKEN，不必在 secrets 里存 PAT。
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建（正式版同时推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          # 只出 linux/amd64：部署目标是 x86_64，而加 arm64 会让**构建阶段**跑在
          # QEMU 模拟里（Go 能交叉编译，但镜像里的 go build 得在模拟器里执行），
          # 每次发布都多等几分钟。有 arm 部署需求时再加 platforms，不提前付这份钱。
          platforms: linux/amd64
          # 手动触发只构建不推送，用来演练 Dockerfile 是否还能 build（与二进制
          # 作业「不建 Release」的思路一致）。
          push: ${{ steps.version.outputs.is_release == 'true' }}
          # VERSION 进 Dockerfile 的 ldflags：容器里没有仓库可查，`amkr --version`
          # 只能靠构建时注入的这个值。
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/sparrived/auto-model-key-router:${{ steps.version.outputs.tag }}
            ghcr.io/sparrived/auto-model-key-router:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # 包默认私有，匿名 `docker pull` 会被拒（实测 denied）。部署机要能直接拉就得
      # 把包设为公开。
      #
      # 用 GITHUB_TOKEN 改不了**用户级**包的可见性（那是用户 API，要 PAT），所以
      # 这一步是尽力而为：失败只留一行提示，不拖垮发布——镜像已经推上去了，手动去
      # Package settings 点一下 public 即可。
      - name: 尝试把包设为公开
        if: steps.version.outputs.is_release == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "/user/packages/container/auto-model-key-router" \
            -f visibility=public \
            && echo "包已设为公开" \
            || echo "::warning::未能自动设为公开，请手动改为 public，否则部署机无法匿名拉取"

  # ---- 构建与发布 ----
  release:
    name: 交叉编译并发布
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与 ci.yml 一致：以 go.mod 的 go 指令为单一来源（当前 1.24.2）。
          # 写死 "1.24" 会解析到 1.24.x 里较旧的补丁版，触发 GOTOOLCHAIN 二次下载。
          go-version-file: go.mod
          cache: true

      - name: 解析版本号
        id: version
        # tag 形如 v5.0.0；去掉 v 得到版本号。工作流手动触发时用提交短哈希占位，
        # 这样构建步骤在演练时也能跑通。
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 交叉编译
        # CGO_ENABLED=0：SQLite 用的是纯 Go 的 modernc.org/sqlite，关掉 cgo 才能得到
        # 静态链接的二进制，也才能在任意平台上直接运行。
        #
        # 注意 webui/ 目录必须在构建上下文里：//go:embed webui 在编译期就要求它存在。
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # set -e：任一平台编译失败必须让这一步失败，而不是被后面的 `ls` 掩盖。
          set -eu
          mkdir -p dist
          for target in \
            "windows amd64 .exe" \
            "windows arm64 .exe" \
            "linux amd64" \
            "linux arm64" \
            "darwin amd64" \
            "darwin arm64"
          do
            set -- $target
            # EXT 必须先单独赋值再用于 -o 参数：`A=1 cmd "$A"` 这种「赋值前缀」里的
            # $A 是在赋值生效**之前**展开的，原写法 `... EXT="$3" go build -o ...${EXT}`
            # 会让 ${EXT} 恒为空——Windows 产物会丢掉 .exe 后缀（这一步在合入前从未真正
            # 执行过，所以没被发现）。
            #
            # GOOS/GOARCH/CGO_ENABLED 反过来必须留在前缀里（或用 export）：它们要进
            # go build 的**环境**，只做普通 shell 变量的话交叉编译不会生效。
            EXT="${3:-}"
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/amkr_${VERSION}_$1_$2${EXT}" ./cmd/amkr
          done
          ls -la dist

      - name: 生成校验和
        # sha256 供用户校验下载物；`sha256sum -c` 可直接使用。
        working-directory: dist
        run: sha256sum amkr_* > checksums.txt && cat checksums.txt

      - name: 上传构建产物（便于手动检查）
        uses: actions/upload-artifact@v4
        with:
          name: amkr-binaries
          path: dist/

      - name: 创建 GitHub Release
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            dist/amkr_* dist/checksums.txt
