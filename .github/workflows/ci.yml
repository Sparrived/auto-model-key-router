name: CI

# AMKR 的测试门禁。Python 参照实现已退役，仓库现在只剩 Go 实现 + 前端资产，
# 因此这里有两个作业：
#   * go    —— gofmt / go vet / go test。涵盖配置读写、canonical 序列化、key 选择、
#              代理改写等模块的行为用例（差分语料已随 Python 参照实现的退役一并删除，
#              不再有逐字节回放；见 CHANGELOG 的「退役冻结语料」一条）。
#   * webui —— React + TypeScript 源码的类型检查、Vitest、Vite 构建，以及构建产物
#              是否已按源码提交的一致性门禁。
#
# 触发：推送到主分支（master）与所有 PR。刻意不加 paths 过滤 —— 任何文件都可能
# 引入漂移（改实现影响行为用例、改 Dockerfile 影响打包等），漏跑等于没门禁。
on:
  push:
    branches: [master]
  pull_request:

# 同一分支上的旧运行直接取消：迁移期提交密集，避免排队堆积、浪费额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 本工作流只读仓库，不推送任何产物。
permissions:
  contents: read

jobs:
  webui:
    name: WebUI 构建与产物一致性（node）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 新版 WebUI 的源码在 web/，`vite build` 写到仓库根的 webui/，后者再被 Go 的
    # //go:embed 原样打进二进制。因此前端不能只验「源码能跑」：还要证明提交入库的产物
    # 与当前源码一致，否则发出去的二进制会带着旧界面。
    #
    # 所有 node 命令都在 web/ 下跑；锁文件是依赖的唯一来源，CI 用 npm ci 复现安装。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 与 web/package.json 的 Vite 版本匹配；Node 22 是当前 LTS 基线。
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        # npm ci 严格按 package-lock.json 安装，不更新锁文件，保证 CI 与本地一致。
        working-directory: web
        run: npm ci

      - name: TypeScript 类型检查
        working-directory: web
        run: npm run typecheck

      - name: 前端测试（Vitest）
        working-directory: web
        run: npm test

      - name: 构建 WebUI
        # 产物写到仓库根的 webui/；Go 侧 //go:embed webui 直接嵌入，运行时不需要 Node。
        working-directory: web
        run: npm run build

      - name: 检查 webui/ 与 web/ 源码一致
        # vite build 会 emptyOutDir 后重新生成 webui/。构建后工作区仍有改动，说明源码变了
        # 但产物没提交；CI 不允许这种漂移，直接给出可执行的修复命令。
        run: |
          if [ -n "$(git status --porcelain -- webui)" ]; then
            echo "webui/ 与 web/ 源码不一致：请在 web/ 下运行 npm run build 后提交 webui/" >&2
            git status --porcelain -- webui >&2
            exit 1
          fi

  go:
    name: Go 静态检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 以 go.mod 的 go 指令为单一来源（当前 1.24.0）：避免工作流里再写一份
          # 字面量、升级 Go 时漏改一处导致两处不一致。
          go-version-file: go.mod
          # 缓存 GOMODCACHE / GOCACHE，缓存 key 默认取 go.sum。
          cache: true

      - name: gofmt 格式检查
        # gofmt -l 只列出「需要格式化」的文件，本身始终返回 0，所以必须自己判断
        # 输出是否为空：有输出就说明有人没跑 gofmt，直接失败。
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下 Go 文件未按 gofmt 格式化，请运行 gofmt -w 后再提交："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 检查通过：所有 Go 文件均已格式化。"

      - name: go vet
        run: go vet ./...

      - name: Go 测试（go test）
        # 行为用例：配置解析与校验、canonical 序列化、key 选择、代理改写、指标读写等。
        run: go test ./...
