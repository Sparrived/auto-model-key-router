name: CI

# AMKR 的测试门禁。Python 参照实现已退役，仓库现在只剩 Go 实现 + 前端资产，
# 因此这里有两个作业：
#   * go    —— gofmt / go vet / go test。涵盖配置读写、canonical 序列化、key 选择、
#              代理改写等模块的行为用例（差分语料已随 Python 参照实现的退役一并删除，
#              不再有逐字节回放；见 CHANGELOG 的「退役冻结语料」一条）。
#   * webui —— 前端资产的 ES 模块加载检查与全部口径探针（清单即下面逐个点名的步骤）。
#
# 触发：推送到主分支（master）与所有 PR。刻意不加 paths 过滤 —— 任何文件都可能
# 引入漂移（改实现影响行为用例、改 Dockerfile 影响打包等），漏跑等于没门禁。
on:
  push:
    branches: [master]
  pull_request:

# 同一分支上的旧运行直接取消：迁移期提交密集，避免排队堆积、浪费额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 本工作流只读仓库，不推送任何产物。
permissions:
  contents: read

jobs:
  webui:
    name: WebUI 资产检查（node）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Python 退役后，前端资产（webui/）仍是随包发布的共享资产，它们的正确性不能只
    # 靠"没改过"来保证。这里用一组独立的 node 探针把它锁住：每个探针只管一个口径，
    # 失败时自己退出非 0。
    #
    # 为什么必须单独跑 module check：探针只 import app.js / api.js / charts.js /
    # chart-math.js 及其传递依赖，**入口 main.js 不被任何探针加载**——它出错
    # （拼错导入、语法错）在其它检查里是盲区，而它坏了整站白屏。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 模块检查依赖 import.meta.dirname，需要 node >= 20.11。
          node-version: "22"

      - name: ES 模块加载检查
        # 逐个 import webui/ 下的全部 ES 模块，抓语法错误与 import 图断裂。
        run: node scripts/webui_module_check.mjs

      - name: 图表口径探针
        # 用 DOM 垫片 + 假 fetch 校验图表数值口径，不依赖真实网络或本机服务。
        run: node webui/probes/webui_chart_probe.mjs

      - name: 提示框探针
        run: node webui/probes/webui_tip_probe.mjs

      - name: 图表首帧宽度探针
        # 锁住"图表往中间挤一下又复原"的内缩闪烁：页面都是先建节点、后挂载，若构造时就
        # 按兜底宽度画了首帧，挂载后 <svg> 被 CSS 拉满容器、viewBox 却仍是旧宽度，
        # preserveAspectRatio 会把整幅图居中等比缩到中间，下一帧才弹回满宽。
        # 这个探针必须自带 DOM 垫片（脱文档节点量不到宽度 + RO 异步回调），
        # 上面两个探针都覆盖不到这条路径。
        run: node webui/probes/webui_chart_sizing_probe.mjs

      - name: 鉴权探针
        # 不传场景名 = 逐个场景各起一个子进程跑全量（模块级 state 不能跨场景复用）。
        # 传错场景名会以退出码 2 失败，不会静默空转。
        run: node webui/probes/webui_auth_probe.mjs

      - name: 成本口径探针
        # 锁住成本公式：缓存 token 不能重复计费；拿不到单价必须回 null 而不是 0
        # （0 会被读成"免费"）；模型名匹配要穿透日期后缀与供应商前缀。
        run: node webui/probes/webui_pricing_probe.mjs

      - name: 供应商页探针
        # 锁住左侧竖向导航与预置：标签页条不能被改回来、预置地址必须与后端
        # 默认路由拼得起来、品牌识别不能被单字符品牌名（xAI）误伤。
        run: node webui/probes/webui_providers_probe.mjs

      - name: 模型路由页探针
        # 同一套左侧竖向导航：模型列表也要竖排在左栏、旧的横排标签页条不能回来，
        # 且切换模型/展开编辑器时右侧详情要跟着换。
        run: node webui/probes/webui_routing_probe.mjs

      - name: 可嵌入面板探针
        # 锁住面板的三条安全规则：凭据只从 URL fragment 取、绝不碰 localStorage
        # （与管理面同源，共享存储会互相覆盖凭据）、绝不发 X-AMKR-Workspace
        # （空间由 key 钉死）。面板会被嵌进第三方后台，这三条是它的全部安全边界。
        run: node webui/probes/webui_panel_probe.mjs

      - name: 看板栅格探针
        # 锁住"每一排都排满"：空轨是 CSS 栅格的产物，DOM 垫片没有 CSS 引擎量不到，
        # 所以它直接读 styles.css 的断点定义与页面里声明的卡片/瓦片/列数，按 max-width
        # 级联算一遍。列数除不尽（孤儿瓦片）与半宽卡落单（空轨）都会在这里失败。
        run: node webui/probes/webui_layout_probe.mjs

      - name: 访客看板探针
        # 访客看板是**唯一**把访问密钥交给浏览器并长期保存的地方，因此它锁的是安全
        # 边界而不是外观：绝不读写管理面的 localStorage 键（共用会让两边互相踢下
        # 线）、绝不自己指定密钥或工作空间、绝不发写请求、明文 key 绝不上页，以及
        # 401（请重填）与 403（已被停用，去找管理员）必须给出不同指引。
        run: node webui/probes/webui_guest_probe.mjs

      - name: 访问密钥探针
        # 访问密钥是发给**外部使用者**的凭据，两份清单（供应商 / 模型）是它唯一的权限收窄
        # 手段，而三态里「不限制」与「一个都不许」是两个相反的授权。这里锁两件事：界面
        # 上没有可以手写清单的文本框（名字要能直接勾选），以及提交体里的三态逐字节正确
        # ——把「全部取消勾选」折叠成「不限制」会让一条禁令静默失效。
        run: node webui/probes/webui_accesskeys_probe.mjs

      - name: 账号资源探针
        # 账号资源页是**唯一**由服务端代问第三方（CPA）管理面的地方，所以它锁的是取数
        # 路径与额度口径：浏览器绝不直接访问 CPA、进页面不把管理密钥拉下来、一次刷新
        # 只发一次请求（这一页不轮询），以及进度条画的是**剩余**比例（20% / 5% 两档
        # 颜色）——画成已用会把 18% 剩余读成「还早」，整页结论反过来。另外钉住故障
        # 隔离：一个实例连不上时，另一个实例的账号照常列出。
        run: node webui/probes/webui_accounts_probe.mjs

  go:
    name: Go 静态检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 以 go.mod 的 go 指令为单一来源（当前 1.24.0）：避免工作流里再写一份
          # 字面量、升级 Go 时漏改一处导致两处不一致。
          go-version-file: go.mod
          # 缓存 GOMODCACHE / GOCACHE，缓存 key 默认取 go.sum。
          cache: true

      - name: gofmt 格式检查
        # gofmt -l 只列出「需要格式化」的文件，本身始终返回 0，所以必须自己判断
        # 输出是否为空：有输出就说明有人没跑 gofmt，直接失败。
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下 Go 文件未按 gofmt 格式化，请运行 gofmt -w 后再提交："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 检查通过：所有 Go 文件均已格式化。"

      - name: go vet
        run: go vet ./...

      - name: Go 测试（go test）
        # 行为用例：配置解析与校验、canonical 序列化、key 选择、代理改写、指标读写等。
        run: go test ./...
